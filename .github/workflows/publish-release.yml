name: Verify and publish approved YQArch release
on:
  push:
    branches: [main, 'release/**']
    paths:
      - '*.md'
      - '*_VERIFICHE.txt'
      - '*SHA256.txt'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check approved release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          readme=Path('README.md').read_text()
          assert 'Versione corrente: 3.78' in readme
          assert 'AutoCAD 2027 italiano' in readme
          sha=Path('YQArch_Italiano_3.78_SHA256.txt').read_text()
          for digest in ['f134c2783721956daea5d3c1176302f31c944bcdc68f332ae87894b2a36c8cc9','ecd56dd0238cd9a949a452a922e2b67075d2d09c9ac04cd5851f88ed79e48c4b']:
              assert digest in sha and digest in readme
          assert Path('RELEASE_NOTES_3.78.md').is_file()
          assert Path('COMPATIBILITA_AUTOCAD_WINDOWS.md').is_file()
          assert Path('INSTALLAZIONE_LEGACY.md').is_file()
          print('Approved 3.78 metadata verified; no executable build.')
          PY
  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve already published original binaries and companion documents
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib
          out=Path('release-assets');out.mkdir()
          expected={'exe':'f134c2783721956daea5d3c1176302f31c944bcdc68f332ae87894b2a36c8cc9','zip':'ecd56dd0238cd9a949a452a922e2b67075d2d09c9ac04cd5851f88ed79e48c4b'}
          names=['YQArch_Italiano_3.78.'+ext for ext in expected]+['YQArch_Italiano_3.78_'+kind+'.html' for kind in ['GUIDA','REPORT','RIBBON','CATALOGO']]+['YQArch_Italiano_3.78_SHA256.txt']
          for name in names:
              response=urllib.request.urlopen('https://andreagiaquinto.it/downloads/yqarch/'+name,timeout=90)
              assert response.status==200
              data=response.read()
              ext=name.rsplit('.',1)[-1]
              if ext in expected:
                  assert hashlib.sha256(data).hexdigest()==expected[ext],name
                  assert data[:2]==(b'MZ' if ext=='exe' else b'PK')
              (out/name).write_bytes(data)
          PY
      - name: Publish using the existing numbered-release convention
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view 3.78 >/dev/null 2>&1; then
            mkdir existing-assets
            gh release download 3.78 --dir existing-assets --pattern '*.exe' --pattern '*.zip'
            cmp release-assets/YQArch_Italiano_3.78.exe existing-assets/YQArch_Italiano_3.78.exe
            cmp release-assets/YQArch_Italiano_3.78.zip existing-assets/YQArch_Italiano_3.78.zip
            echo 'Existing release already contains the approved binaries; not overwritten.'
          else
            gh release create 3.78 release-assets/* --target "$RELEASE_COMMIT" --title 'YQArch Italiano 3.78' --notes-file RELEASE_NOTES_3.78.md
          fi
