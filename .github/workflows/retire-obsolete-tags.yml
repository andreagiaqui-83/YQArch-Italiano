name: Retire remaining obsolete YQArch tags
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-obsolete-tags.yml']
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and remove two remaining historical tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          assert os.environ['GITHUB_REPOSITORY'] == 'andreagiaqui-83/YQArch-Italiano'
          base='https://api.github.com/repos/andreagiaqui-83/YQArch-Italiano/git/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          expected=[{"ref":"refs/tags/3.28","sha":"88b6ea330c09de64c4f3156e1a7212b62932a497"},{"ref":"refs/tags/YQArch_italian","sha":"88b6ea330c09de64c4f3156e1a7212b62932a497"}]
          def api(path,method='GET'):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers,method=method),timeout=30) as r:
                      data=r.read();return json.loads(data) if data else None
              except urllib.error.HTTPError as e:
                  if e.code==404:return None
                  raise
          for tag in expected:
              r=api('ref/'+tag['ref'].removeprefix('refs/'))
              assert r is None or r['object']['sha']==tag['sha'], 'Tag changed; manual review required'
          for tag in expected:
              api(tag['ref'],'DELETE')
              assert api('ref/'+tag['ref'].removeprefix('refs/')) is None
              print('Retired historical tag:',tag['ref'])
          assert api('matching-refs/tags/') == []
          print('Verified: no version tags remain')
          PY
